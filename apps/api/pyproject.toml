[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ascertain-api"
version = "0.1.0"
description = "Ascertain healthcare dashboard — FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "anthropic>=0.39",
  "email-validator>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "testcontainers[postgres]>=4.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic migrations are autogenerated; we don't police their style. The
# spec-align migration was hand-edited but only by adding comments + SQL,
# both of which are fine to leave as-is.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
# - N818 (Exception-name "Error" suffix) is stylistic and we follow the
#   shorter `XxxNotFound` convention consistently across services.
# - UP046 (PEP 695 generic class syntax) is opt-in modernization; SQLAlchemy
#    2.0 + Pydantic v2 compatibility is cleaner with the classic Generic[T]
#   form today.
ignore = ["N818", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
