# Overlay for `docker compose watch` — gives both api and web hot-reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml watch
services:
  web:
    build:
      context: ./apps/web
      target: dev
      args:
        VITE_API_URL: ${VITE_API_URL}
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src
        - action: sync
          path: ./apps/web/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./apps/web/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./apps/web/package.json
