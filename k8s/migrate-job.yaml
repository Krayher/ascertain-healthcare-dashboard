apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ascertain
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ascertain-api:latest
          command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secret }
